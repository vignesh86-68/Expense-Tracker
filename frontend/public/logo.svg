<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)" />

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="110" ry="110"
    fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Chart bars (left side) -->
  <rect x="88" y="310" width="58" height="122" rx="12" fill="rgba(255,255,255,0.25)" />
  <rect x="166" y="250" width="58" height="182" rx="12" fill="rgba(255,255,255,0.35)" />
  <rect x="244" y="190" width="58" height="242" rx="12" fill="rgba(255,255,255,0.5)" />

  <!-- Trending arrow line -->
  <polyline
    points="100,340 190,270 280,200 390,120"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrow head -->
  <polyline
    points="330,100 392,118 374,182"
    fill="none"
    stroke="white"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Rupee symbol (small, top-right) -->
  <text x="368" y="310" font-family="Arial, sans-serif" font-weight="900"
    font-size="88" fill="rgba(255,255,255,0.18)" text-anchor="middle">₹</text>
</svg>
