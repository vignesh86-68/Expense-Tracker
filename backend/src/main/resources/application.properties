# ===== DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:mysql://localhost:3306/expensedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=vignesh02@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== SERVER =====
server.port=8080

# ===== JWT =====
app.jwt.secret=MyVerySecretKeyForJWTSigningThatIsAtLeast256BitsLong1234567890ABCDEF
app.jwt.expiration=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000

# ===== LOGGING =====
logging.level.com.example.expensetracker=DEBUG
logging.level.org.springframework.security=INFO

# TEMP FIX
spring.main.allow-circular-references=true